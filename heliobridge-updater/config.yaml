name: Heliobridge Updater
version: "1.3.0"
slug: heliobridge_updater
description: Checks the Heliobridge HAOS repository and installs upstream releases mirrored automatically from the original author
url: "https://github.com/braumandl/heliobridge-haos"
arch:
  - amd64
startup: application
boot: auto
init: false
hassio_api: true
hassio_role: manager
options:
  app_name: Heliobridge
  app_slug: "d166b643_heliobridge"
  check_interval_hours: 12
  backup_before_update: true
  auto_update: true
schema:
  app_name: str(1,64)
  app_slug: str?
  check_interval_hours: int(1,168)
  backup_before_update: bool
  auto_update: bool
