name: Sync upstream Heliobridge release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-heliobridge
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out HAOS packaging repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Mirror latest stable upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-upstream.py

      - name: Commit upstream release when changed
        run: |
          if git diff --quiet; then
            echo "No upstream release change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heliobridge/heliobridge-source heliobridge/config.yaml heliobridge/Dockerfile UPSTREAM_VERSION
          git commit -m "chore: sync upstream Heliobridge release $(cat UPSTREAM_VERSION)"
          git push
